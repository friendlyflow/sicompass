[package]
publish = false  # internal crate, never published to crates.io
name = "sicompass-webbrowser"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Sicompass web browser provider"

[dependencies]
sicompass-sdk = { workspace = true }
chromiumoxide = "0.9"
serde = { workspace = true }
futures = "0.3"
which = "8"
tokio = { workspace = true }
# Reading `<link rel="alternate" hreflang>` out of `<head>`, which the SDK
# walker skips whole. Same version the SDK already pulls in, so this shares
# its build rather than adding a second copy.
scraper = "0.27"

[dev-dependencies]
tokio = { workspace = true }
# Isolating the URL-history file from the developer's real one.
tempfile = { workspace = true }
# Reading the geometry and banding decisions back out of the page. Test-only:
# the script itself hands Chrome a string and gets a string back.
serde_json = { workspace = true }
