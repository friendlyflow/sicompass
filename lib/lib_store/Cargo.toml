[package]
publish = false  # internal crate, never published to crates.io
name = "sicompass-store"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "The Store: installs, updates and removes sicompass plugins from the signed store list"

[dependencies]
sicompass-sdk = { workspace = true, features = ["package"] }
serde_json = { workspace = true }
reqwest = { workspace = true, features = ["blocking"] }
semver = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }
wiremock = { workspace = true }
tokio = { workspace = true }
