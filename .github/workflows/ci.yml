name: CI

# Runs the test suite and clippy. Manual only — start it from the GitHub web UI:
# Actions -> CI -> Run workflow. Nothing in this repository runs as a side effect
# of committing; every run is something someone chose to start.
#
# The WASM plugin host is built two different ways — Cranelift for normal builds,
# Pulley for the App Store / iOS one — and they are genuinely different code paths,
# not a flag. A guest that traps on fuel under Cranelift trips the wall-clock
# deadline under Pulley instead, and `Component::new` does not even exist without a
# compiler backend. Testing one leg would leave the other untested until release.
on:
  workflow_dispatch:

# A newer dispatch supersedes an in-flight run on the same ref.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: test (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    strategy:
      # Report every leg even when one fails: knowing whether a failure is
      # backend- or platform-specific is most of the diagnosis.
      fail-fast: false
      matrix:
        include:
          # Linux runs the full suite over both wasmtime backends.
          - name: linux cranelift (jit)
            os: ubuntu-22.04
            flags: ""
            full: true
          - name: linux pulley (no-jit)
            os: ubuntu-22.04
            flags: "--no-default-features --features no-jit-wasm"
            full: true
          # macOS and Windows compile and lint rather than running the full
          # suite, which reaches the network and wants a display. The
          # compile-and-link check is what catches the porting breakage that
          # used to only surface during a release.
          #
          # `subset` additionally runs the deterministic, offline tests. It is
          # off on Windows because `.cargo/config.toml` sets a `runner` for
          # x86_64-pc-windows-msvc pointing at C:\sicompass\.cargo\run.bat,
          # which exists on one developer machine and not on a runner, so
          # `cargo test` fails with "The system cannot find the path
          # specified" before any test executes. Removing or scoping that
          # runner would let Windows run these too.
          - name: macos aarch64
            os: macos-14
            flags: ""
            full: false
            subset: true
          - name: macos x86_64
            os: macos-15-intel
            flags: ""
            full: false
            subset: true
          - name: windows x86_64
            os: windows-2022
            flags: ""
            full: false
            subset: false
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      # SDL3 is compiled from its vendored source by the `bundled-sdl3`
      # feature, which is what the release builds use. These are the headers
      # it probes for at configure time.
      #
      # FreeType is deliberately NOT installed from apt. jammy ships 2.11.1,
      # whose freetype2.pc reports libtool version 24.1.18, below the 24.3.18
      # floor freetype-sys checks. It would be ignored in favour of a vendored
      # build with PNG support switched off, and every colour emoji would
      # silently vanish. scripts/setup-freetype.sh builds a new enough one, and
      # libpng and zlib are what that build needs.
      #
      # It used to build SDL 3.2.28 from source here instead, because
      # `bundled-sdl3` failed under GCC. The cause was ours: the feature also
      # set `sdl3-sys/no-sdl-libc`, which becomes `-DSDL_LIBC=OFF`, which
      # un-defines HAVE_STDIO_H, which is the guard around the
      # `#include <errno.h>` in SDL's SDL_iostream.c. That flag is now
      # Windows-only, where it is actually needed. Do not reintroduce the
      # from-source SDL step: CI building something other than what the
      # release builds is exactly how the release broke.
      - name: Install system dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential pkg-config cmake \
            libvulkan-dev \
            libpng-dev zlib1g-dev \
            libwayland-dev libxkbcommon-dev libdecor-0-dev \
            libx11-dev libxext-dev libxcursor-dev libxi-dev \
            libxrandr-dev libxss-dev libxfixes-dev libxrender-dev \
            libxtst-dev libxcb1-dev \
            libpulse-dev libasound2-dev libdbus-1-dev libatspi2.0-dev \
            libdrm-dev libgbm-dev libegl-dev libssl-dev

      - name: Install system dependencies (macOS)
        if: runner.os == 'macOS'
        run: brew install cmake molten-vk

      # Must come before any cargo invocation: freetype-sys resolves FreeType
      # in its build script, so PKG_CONFIG_PATH has to be set by then.
      - name: Provide a PNG-capable FreeType (Linux and macOS)
        if: runner.os != 'Windows'
        run: ./scripts/setup-freetype.sh >> "$GITHUB_ENV"

      - name: Provide a PNG-capable FreeType (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./scripts/setup-freetype.ps1

      # The FreeType setup is part of the cache key on purpose. freetype-sys
      # only emits `rerun-if-env-changed=PKG_CONFIG_PATH` when it actually
      # takes the pkg-config path; a cached build that took the vendored
      # fallback never emitted it, so cargo would happily reuse that stale
      # artifact no matter what PKG_CONFIG_PATH later says.
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.name }}-ft${{ hashFiles('scripts/setup-freetype.sh', 'scripts/setup-freetype.ps1') }}

      - name: Test
        if: matrix.full
        run: cargo test --workspace --features bundled-sdl3 ${{ matrix.flags }}

      # The deterministic, offline part of the suite: the embedded shader and
      # font checks, and the resource-root probe. Cheap, and worth running
      # cross-platform since `resources.rs` is entirely about path layout.
      #
      # Quoted, and the filters go after `--`: cargo takes at most one
      # positional TESTNAME itself, and an unquoted `::` reads as a YAML
      # mapping.
      - name: Test (portable subset)
        if: matrix.subset
        run: "cargo test -p sicompass --lib --features bundled-sdl3 -- shaders:: fonts:: resources::"

      - name: Build
        if: ${{ !matrix.full }}
        run: cargo build -p sicompass --release --features bundled-sdl3

      - name: Clippy
        run: cargo clippy --workspace --all-targets --features bundled-sdl3 ${{ matrix.flags }}

      # The shipped binary reporting on itself. This is the only emoji check
      # that can run on Windows at all, because `.cargo/config.toml` sets a
      # `runner` that makes `cargo test` unrunnable there, and it is the only
      # one on macOS since the emoji test is not in the portable subset. On
      # Linux the unit test covers it.
      #
      # Split from the Vulkan check below because the two have different
      # standards of proof: a FreeType without PNG support is unambiguously
      # broken and should fail the build, whereas Vulkan on a headless runner
      # legitimately might not work.
      # Read from SICOMPASS_CHECK_FILE rather than stdout. Two reasons, both
      # learned the hard way: the release Windows binary has no console, so
      # stdout is empty there however well it ran; and MoltenVK can abort the
      # process during the Vulkan probe, which would take buffered stdout with
      # it. The file is written section by section, so the font findings
      # survive either.
      - name: Verify colour emoji support
        if: ${{ !matrix.full }}
        shell: bash
        env:
          SICOMPASS_CHECK_FILE: check.txt
        run: |
          # `--check` exits non-zero when anything is wrong, including Vulkan,
          # which is expected on a headless runner. The emoji line is what
          # this step judges.
          ./target/release/sicompass --check || true
          echo "--- check report ---"
          cat check.txt || true
          if ! grep -q 'OK .*colour emoji' check.txt; then
            echo "::error::FreeType was built without PNG support, so colour emoji will not render."
            echo "::error::See scripts/setup-freetype.sh."
            exit 1
          fi

      # "Does MoltenVK actually enumerate a device" decides whether the .dmg
      # works at all, and nobody here has a Mac to check by hand. Not fatal:
      # GitHub's macOS runners virtualize Metal, so a failure is inconclusive.
      - name: Vulkan smoke check (macOS)
        if: runner.os == 'macOS'
        continue-on-error: true
        run: ./target/release/sicompass --check

  # A stale generated release.yml is currently only discovered during a tag
  # push, which is the worst possible moment.
  release-config:
    name: release config is in sync
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: dist

      # Must be the exact pinned version: a different one regenerates the
      # workflow for itself, silently, and the output still looks plausible.
      - name: Install the pinned dist
        run: |
          V=$(grep -oP 'cargo-dist-version = "\K[^"]+' dist-workspace.toml)
          cargo install cargo-dist --version "$V" --locked

      - name: Check the generated workflow matches dist-workspace.toml
        run: dist generate --check

      - name: Show the release plan
        run: dist plan

  # The guest half of the SDK has to keep building for wasm, and the example plugin
  # has to keep producing a component that imports nothing beyond the host
  # interfaces. That audit is the security property in this design, so it belongs in
  # CI rather than in a script someone remembers to run.
  guest:
    name: wasm guest builds and audits clean
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Install wasm-tools
        uses: bytecodealliance/actions/wasm-tools/setup@v1

      - uses: Swatinem/rust-cache@v2
        with:
          key: guest

      # The fixtures the host tests run against are committed, so this checks they
      # still match what the current sources produce rather than silently drifting.
      - name: Rebuild the example plugin and compare with the committed fixture
        run: |
          if [ ! -d ../sicompass-plugin-sdk ]; then
            echo "::notice::SDK checkout not present; skipping guest rebuild."
            exit 0
          fi
          cd ../sicompass-plugin-sdk && ./scripts/verify-guest.sh

      # Independent of the SDK checkout: the committed fixtures must import nothing
      # the host does not offer.
      - name: Audit the committed fixtures
        run: |
          for f in src/sicompass/tests/fixtures/wasm/*.wasm; do
            echo "== $f"
            imports=$(wasm-tools component wit "$f" | grep -E '^\s*import' || true)
            echo "$imports"
            if echo "$imports" | grep -qi 'wasi:'; then
              echo "::error::$f imports WASI, which voids the capability model"
              exit 1
            fi
            if echo "$imports" | grep -vE 'sicompass:plugin/(types|host|net)@' | grep -q 'import'; then
              echo "::error::$f imports an interface the host does not provide"
              exit 1
            fi
          done
