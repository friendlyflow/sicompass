name: Native packages

# Builds the package formats cargo-dist cannot: .deb, .rpm and AppImage on
# Linux, .app and .dmg on macOS.
#
# ## Why this is a reusable workflow and not a top-level one
#
# `release-publish.yml` triggers on `workflow_run` of the workflow named
# "Release" and downloads the `artifacts-*` from *that run*. A separate
# top-level workflow would produce its artifacts in a different run, and there
# would be no supported way to attach them to the same release.
#
# So cargo-dist calls this one from inside the Release run, via
# `local-artifacts-jobs = ["./native-packages"]` in dist-workspace.toml. Anything
# uploaded here under a name starting with `artifacts-` is picked up by
# release-publish.yml with no changes on its side.
#
# ## Constraints worth knowing before editing
#
#   - Every uploaded file must sit flat in `out/` with no spaces in its name.
#     release-publish.yml globs with an unquoted `$(find ...)`, so a space
#     breaks the upload and a stray file gets attached to the release.
#   - Both macOS legs produce the same filename, so the .dmg is renamed to its
#     target triple before upload or the two collide.
#   - Nothing here runs on a commit or a pull request. It only ever runs as
#     part of a Release, which is itself dispatch-triggered.

on:
  workflow_call:
    inputs:
      plan:
        description: The dist plan for this release, passed by cargo-dist.
        required: true
        type: string

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  # Pinned so a new upstream release cannot change what a rebuild of an old
  # tag produces.
  CARGO_PACKAGER_VERSION: "0.11.8"
  CARGO_GENERATE_RPM_VERSION: "0.21.0"

jobs:
  linux:
    name: .deb, .rpm and AppImage
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@stable

      - name: Install build dependencies
        # Mirrors [dist.dependencies.apt] in dist-workspace.toml. SDL3 is
        # compiled from source by the `bundled-sdl3` feature and probes for
        # each windowing, audio and DRM backend at configure time.
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            cmake pkg-config \
            libpng-dev zlib1g-dev \
            libx11-dev libxext-dev libxcursor-dev libxi-dev libxrandr-dev \
            libxss-dev libxfixes-dev libxrender-dev libxtst-dev libxcb1-dev \
            libwayland-dev libxkbcommon-dev libdecor-0-dev \
            libegl-dev libgbm-dev libdrm-dev \
            libpulse-dev libasound2-dev \
            libdbus-1-dev libatspi2.0-dev libssl-dev \
            desktop-file-utils file

      # Before any cargo invocation. Without it the packaged binary falls back
      # to a FreeType without PNG support and renders no colour emoji.
      - name: Provide a PNG-capable FreeType
        run: ./scripts/setup-freetype.sh >> "$GITHUB_ENV"

      - uses: Swatinem/rust-cache@v2
        with:
          key: ft${{ hashFiles('scripts/setup-freetype.sh') }}

      - name: Install packaging tools
        run: |
          cargo install cargo-packager --locked --version "$CARGO_PACKAGER_VERSION"
          cargo install cargo-generate-rpm --locked --version "$CARGO_GENERATE_RPM_VERSION"

      - name: Build
        run: cargo build --release --features bundled-sdl3 -p sicompass

      - name: Sanity check the binary before packaging it
        # Catches a binary that cannot find its own resources, or was built
        # against a FreeType without PNG support, before that becomes three
        # broken packages. There is no GPU on the runner, so Vulkan is
        # expected to fail and the exit code is ignored. The report is read
        # from a file rather than stdout so a driver that aborts the process
        # does not take the findings with it.
        env:
          SICOMPASS_CHECK_FILE: check.txt
        run: |
          ./target/release/sicompass --check || true
          cat check.txt || true
          grep -q 'OK .*colour emoji' check.txt \
            || { echo "::error::built without PNG-capable FreeType"; exit 1; }

      - name: Build .deb and AppImage
        # GitHub runners have no FUSE, so appimagetool cannot mount its own
        # AppImage. APPIMAGE_EXTRACT_AND_RUN makes it extract and exec instead.
        env:
          APPIMAGE_EXTRACT_AND_RUN: "1"
        run: cargo packager --release --formats deb,appimage -p sicompass --verbose

      - name: Add the .deb maintainer scripts
        # cargo-packager cannot emit postinst/postrm, so the icon cache and the
        # application database were never refreshed on install and the menu
        # entry appeared without an icon. See the script header. The .rpm gets
        # the same treatment from `post_install_script` in Cargo.toml, which
        # cargo-generate-rpm does support.
        run: |
          set -euo pipefail
          for deb in target/packages/*.deb; do
            ./scripts/deb-add-maintainer-scripts.sh "$deb"
          done

      - name: Build .rpm
        # Run from the workspace root: the `assets` source paths in
        # [package.metadata.generate-rpm] are relative to the working
        # directory, not to the manifest.
        run: cargo generate-rpm -p src/sicompass

      - name: Stage artifacts
        run: |
          set -euo pipefail
          mkdir -p out
          find target/packages target/generate-rpm -type f \
            \( -name '*.deb' -o -name '*.AppImage' -o -name '*.rpm' \) \
            -exec cp {} out/ \;
          # Fail loudly rather than uploading an empty artifact that only
          # shows up as a missing download on the release page.
          test -n "$(ls -A out)" || { echo "::error::no Linux packages were produced"; exit 1; }
          cd out && sha256sum * > SHA256SUMS-linux.txt
          ls -la

      - uses: actions/upload-artifact@v6
        with:
          name: artifacts-native-linux
          path: out/*
          if-no-files-found: error

  macos:
    name: .app and .dmg (${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-14
            arch: aarch64
            triple: aarch64-apple-darwin
          - runner: macos-15-intel
            arch: x86_64
            triple: x86_64-apple-darwin
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@stable

      - name: Install build dependencies
        # molten-vk is the Vulkan implementation on macOS. It is both a build
        # input (it gets bundled into the .app) and what makes the app able to
        # render at all.
        run: brew install cmake molten-vk create-dmg

      - name: Provide a PNG-capable FreeType
        run: ./scripts/setup-freetype.sh >> "$GITHUB_ENV"

      - uses: Swatinem/rust-cache@v2
        with:
          key: ft${{ hashFiles('scripts/setup-freetype.sh') }}

      - name: Install cargo-packager
        run: cargo install cargo-packager --locked --version "$CARGO_PACKAGER_VERSION"

      - name: Point the packager at this runner's MoltenVK
        # Homebrew's prefix is /opt/homebrew on Apple Silicon and /usr/local on
        # Intel, and the Cargo.toml can only hold one of them.
        run: |
          set -euo pipefail
          PREFIX="$(brew --prefix)"
          test -f "$PREFIX/lib/libMoltenVK.dylib" \
            || { echo "::error::libMoltenVK.dylib not found under $PREFIX"; exit 1; }
          sed -i '' "s#/opt/homebrew/lib/libMoltenVK.dylib#$PREFIX/lib/libMoltenVK.dylib#" \
            src/sicompass/Cargo.toml
          # Homebrew ships this dylib mode 444 and cargo-packager copies it into
          # Contents/Frameworks with that mode intact. `xattr -d` needs write
          # permission on the file it clears, so the quarantine one-liner in the
          # README died with EACCES on this one file for every macOS user, on
          # the one step nobody can skip since the app will not open until the
          # flag is gone.
          #
          # Fixed at the source rather than in the bundle: the .app is built and
          # sealed into the .dmg inside a single cargo-packager invocation, so
          # there is no point in between at which the copy could be chmod'd.
          chmod u+w "$PREFIX/lib/libMoltenVK.dylib"
          # cargo-packager hands the entitlements path to codesign verbatim
          # rather than resolving it against the manifest, so make it absolute.
          sed -i '' "s#entitlements = \"src/sicompass/macos-entitlements.plist\"#entitlements = \"$PWD/src/sicompass/macos-entitlements.plist\"#" \
            src/sicompass/Cargo.toml
          grep -q "entitlements = \"$PWD/" src/sicompass/Cargo.toml \
            || { echo "::error::entitlements path was not made absolute"; exit 1; }

      - name: Build
        run: cargo build --release --features bundled-sdl3 -p sicompass

      - name: Sanity check the binary before packaging it
        # The macOS half of the Linux step above, plus the one check that only
        # matters here. 0.1.10 shipped a .dmg that aborted at launch on every
        # Mac without `brew install freetype`, because the binary carried an
        # absolute /opt/homebrew path for libfreetype.6.dylib. Nothing failed
        # on the runner, where that path exists. See the script header.
        env:
          SICOMPASS_CHECK_FILE: check.txt
        run: |
          set -euo pipefail
          ./scripts/check-macos-standalone.sh target/release/sicompass
          ./target/release/sicompass --check || true
          cat check.txt || true
          grep -q 'OK .*colour emoji' check.txt \
            || { echo "::error::built without PNG-capable FreeType"; exit 1; }

      - name: Build the .app and the .dmg
        # One invocation on purpose. The .dmg packager rebuilds the .app
        # whenever one was not produced in the same run, so splitting this into
        # `--formats app` and `--formats dmg` means the second command discards
        # whatever the first produced, and anything done to the bundle in
        # between is thrown away with it.
        #
        # That leaves no point in the workflow at which the bundle can be signed
        # and still reach a user, which is why `signing-identity` is set in
        # src/sicompass/Cargo.toml and cargo-packager signs it between its own
        # app and dmg stages instead. See the comment there. Every release up to
        # 0.1.12 shipped an unsigned bundle because a `codesign` step here ran
        # after the .dmg had already been sealed.
        run: cargo packager --release --formats app,dmg -p sicompass --verbose

      - name: Check the assembled .app is standalone
        # Re-run over the bundle, not just the binary: this covers the dylibs
        # cargo-packager copies in and the install names it rewrites while
        # doing so, which is work that happens after the check above.
        run: |
          set -euo pipefail
          APP="$(find target/packages -maxdepth 1 -name '*.app' | head -1)"
          ./scripts/check-macos-standalone.sh "$APP"

      - name: The bundled binary must reach MoltenVK
        # Regression guard. The `--check` probe used to ask unconditionally for
        # VK_KHR_portability_enumeration, which is implemented by the Vulkan
        # *loader*. The .app loads its bundled MoltenVK directly as the driver,
        # so the extension is absent there, `create_instance` was refused
        # outright, and `--check` reported "no Vulkan" on a bundle that renders
        # perfectly well.
        #
        # It also has to catch a bundle that cannot open its own dylib. 0.1.14
        # shipped exactly that: signing applied the hardened runtime, and
        # library validation then refused the ad-hoc signed binary its ad-hoc
        # signed libMoltenVK.dylib, so the app could not render at all.
        #
        # Nothing here may depend on the runner having a GPU. It does not: these
        # are VMs, and MoltenVK *aborts the process* rather than returning an
        # error when it finds no Metal device, so `--check` dies partway through
        # and never prints a Vulkan section at all. An earlier version of this
        # step required `OK loader` and failed every build for that reason, on
        # an artifact that was perfectly good.
        #
        # So the load-bearing assertion is the entitlement, which is a property
        # of the bundle rather than of the machine. The greps below are extra:
        # they only fire when `--check` did get far enough to report.
        env:
          SICOMPASS_CHECK_FILE: app-check.txt
        run: |
          set -euo pipefail
          APP="$(find target/packages -maxdepth 1 -name '*.app' | head -1)"

          codesign -d --entitlements - "$APP" 2>/dev/null \
            | grep -q 'disable-library-validation' \
            || { echo "::error::bundle lacks the entitlement that lets it load its own MoltenVK"; exit 1; }

          "$APP/Contents/MacOS/sicompass" --check || true
          cat app-check.txt || true
          if grep -q 'not valid for use in process' app-check.txt; then
            echo "::error::the hardened runtime refused the bundled MoltenVK"
            exit 1
          fi
          if grep -q 'Extension specified does not exist' app-check.txt; then
            echo "::error::the bundled app asks MoltenVK for an extension only the loader provides"
            exit 1
          fi

      - name: Verify the .dmg ships that bundle
        # The check that was missing. Every step above inspects the loose .app;
        # this is the only one that opens what a user actually downloads, which
        # is exactly where the two bugs above hid. Mounted read-only, so the
        # stored permission bits are what a user would get.
        run: |
          set -euo pipefail
          DMG="$(find target/packages -maxdepth 1 -name '*.dmg' | head -1)"
          test -n "$DMG" || { echo "::error::no .dmg was produced"; exit 1; }
          MNT="$(mktemp -d)"
          # `yes |` is not optional: the .dmg carries the license agreement, and
          # hdiutil blocks waiting for it to be accepted, then reports "attach
          # canceled" when it hits EOF on a CI runner's stdin.
          #
          # pipefail is off for that one line because `yes` is killed by SIGPIPE
          # as soon as hdiutil stops reading, so the pipeline reports 141 and
          # `set -e` would abort the step on a *successful* mount. The `test -n`
          # below is what catches a genuinely failed attach.
          set +o pipefail
          yes | hdiutil attach "$DMG" -nobrowse -readonly -noverify -mountpoint "$MNT" >/dev/null
          set -o pipefail
          trap 'hdiutil detach "$MNT" -quiet || true' EXIT
          APP="$(find "$MNT" -maxdepth 1 -name '*.app' | head -1)"
          test -n "$APP" || { echo "::error::the .dmg contains no .app"; exit 1; }
          codesign --verify --deep --strict "$APP"
          # An unsigned bundle prints "Sealed Resources=none" here, so match the
          # version field rather than the label.
          codesign -dv "$APP" 2>&1 | grep -q 'Sealed Resources version=' \
            || { echo "::error::the bundle in the .dmg has no sealed resources"; exit 1; }
          UNWRITABLE="$(find "$APP" ! -perm -u+w)"
          test -z "$UNWRITABLE" || {
            echo "::error::these are not owner-writable, so xattr -dr cannot clear quarantine:"
            echo "$UNWRITABLE"
            exit 1
          }

      - name: Stage artifacts
        # Rename to the target triple: both legs otherwise emit the same
        # filename and would overwrite each other on the release.
        run: |
          set -euo pipefail
          mkdir -p out
          DMG="$(find target/packages -maxdepth 1 -name '*.dmg' | head -1)"
          test -n "$DMG" || { echo "::error::no .dmg was produced"; exit 1; }
          cp "$DMG" "out/sicompass-${{ matrix.triple }}.dmg"
          cd out && shasum -a 256 * > "SHA256SUMS-${{ matrix.triple }}.txt"
          ls -la

      - uses: actions/upload-artifact@v6
        with:
          name: artifacts-native-macos-${{ matrix.arch }}
          path: out/*
          if-no-files-found: error
