name: CI

# Tests, clippy, the format check, and a dry-run release of this computer's
# platform, packed and verified the way the Store will. Manual only, like every
# workflow in the sicompass repos: Actions -> CI -> Run workflow. The toolchain
# is the flake's dev shell, the same one used locally.
on:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  SDK_TAG: v0.9.1

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: cachix/install-nix-action@v31
      - name: Install the release tool
        run: |
          nix develop -c cargo install --git https://github.com/friendlyflow/sicompass-plugin-sdk \
            --tag "$SDK_TAG" sicompass-plugin --root "$RUNNER_TEMP/tool"
          echo "SICOMPASS_PLUGIN=$RUNNER_TEMP/tool/bin/sicompass-plugin" >> "$GITHUB_ENV"
      - name: Test
        run: nix develop -c cargo test
      - name: Build, pack and verify (dry run)
        run: nix develop -c ./scripts/release-plugin.sh --dry-run
      - name: Clippy
        run: nix develop -c cargo clippy --all-targets -- -D warnings
      - name: Format
        run: nix develop -c cargo fmt --check
