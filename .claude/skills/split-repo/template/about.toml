# Configuration for `cargo about`, which generates the third-party attribution
# file. Copied from the sicompass repo, where the reasoning behind each entry is
# written out in full.
#
# Regenerate the attribution file with:
#   cargo about generate about.hbs > THIRD-PARTY-LICENSES.html
#
# `accepted` lists every SPDX license that is allowed to appear in the
# dependency tree. `cargo about` fails if a dependency uses anything else,
# which is the early-warning signal if a future dependency pulls in GPL/AGPL
# or another license incompatible with the proprietary arm of the dual license.

# Only the platforms this repo actually ships for.
targets = [
@TARGETS@
]

ignore-build-dependencies = true
ignore-dev-dependencies = true

accepted = [
    # Permissive: compatible with both the proprietary and GPLv3 arms.
    "MIT",
    "MIT-0",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "0BSD",
    "BSL-1.0",
    "Unlicense",
    "Unicode-3.0",
    "CC0-1.0",
    "NCSA",
    "CDLA-Permissive-2.0",
    # Weak (file-level) copyleft: safe to bundle as long as the crate's own
    # source files are not modified.
    "MPL-2.0",
    # Appears only inside disjunctions, where a permissive alternative is
    # always selected.
    "LGPL-2.1-or-later",
]

# This crate itself (`publish = false`) is covered by the dual license.
[private]
ignore = true

# First-party sicompass crates are GPL-3.0-only like this one, and are consumed
# from crates.io or by git, so `private.ignore` does not catch them. Accept
# their GPL scoped to each crate only. The global list above stays GPL-free, so
# any *other* dependency that pulls in GPL still trips the gate.
[sicompass-sdk]
accepted = ["GPL-3.0-only"]

[sicompass-ui]
accepted = ["GPL-3.0-only"]

[sicompass-payments]
accepted = ["GPL-3.0-only"]
