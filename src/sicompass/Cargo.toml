[package]
publish = false  # internal crate, never published to crates.io
name = "sicompass"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "sicompass — Vulkan/SDL3 modal UI (Rust port)"
repository = "https://github.com/friendlyflow/sicompass"
authors = ["Nico Verrijdt <nico@friendlyflow.com>"]

[[bin]]
name = "sicompass"
path = "src/main.rs"

[lib]
name = "sicompass"
path = "src/lib.rs"

# This crate is `publish = false` (never goes to crates.io), which by default
# also hides it from cargo-dist. Opt the binary back into release builds.
[package.metadata.dist]
dist = true

[package.metadata.wix]
upgrade-guid = "0865D57F-AEA6-4BCA-AB03-543D1EE69091"
path-guid = "3D255495-2455-4CAB-8782-168EF8D5E8A7"
license = false
eula = false

# ---------------------------------------------------------------------------
# Native packages (cargo-packager)
# ---------------------------------------------------------------------------
#
# cargo-dist builds the archives and the .msi. It cannot produce .deb, .rpm,
# AppImage, .app or .dmg, so
# cargo-packager builds those, driven by .github/workflows/native-packages.yml.
#
# `product-name` deliberately has no spaces and no apostrophes: the artifact
# names derived from it are passed through an unquoted `$(find ...)` in
# release-publish.yml, so a space would silently break the upload.
#
# Paths are relative to this file, hence the `../../` to reach the workspace
# root.
[package.metadata.packager]
product-name = "sicompass"
identifier = "com.friendlyflow.sicompass"
description = "Use your whole computer from the keyboard, with no mouse needed"
long-description = """
Sicompass presents every screen as a tree of lists and lets you move \
through it entirely from the keyboard. Files, settings, email and any other \
data are navigated the same way, with native screen reader support on Linux, \
macOS and Windows.
"""
homepage = "https://github.com/friendlyflow/sicompass"
authors = ["Nico Verrijdt <nico@friendlyflow.com>"]
license-file = "../../LICENSE"
out-dir = "../../target/packages"

# cargo-packager runs this itself, so `cargo packager` works standalone from a
# clean checkout. In CI the build has already happened and this is a no-op.
before-packaging-command = "cargo build --release --features bundled-sdl3 -p sicompass"

# Generated from assets/icons/sicompass.svg by scripts/gen-icons.sh. The PNGs
# become /usr/share/icons/hicolor/<size>/apps/sicompass.png in the .deb and
# AppImage; the .icns becomes the .app bundle icon.
icons = [
    "../../assets/icons/16x16.png",
    "../../assets/icons/22x22.png",
    "../../assets/icons/24x24.png",
    "../../assets/icons/32x32.png",
    "../../assets/icons/48x48.png",
    "../../assets/icons/64x64.png",
    "../../assets/icons/128x128.png",
    "../../assets/icons/128x128@2x.png",
    "../../assets/icons/256x256.png",
    "../../assets/icons/512x512.png",
    "../../assets/icons/sicompass.icns",
]

[[package.metadata.packager.binaries]]
path = "sicompass"
main = true

# Shaders, fonts and every provider asset are compiled into the binary, so there
# is no runtime tree to place here. The tutorial's and sales demo's files live in
# `lib/lib_tutorial/assets/` and `lib/lib_sales_demo/assets/`, where those crates
# `include_bytes!` them; nothing reads them from disk at runtime, on any platform.
#
# The fonts are embedded in the binary, so their license texts have to travel
# with it. This is a real obligation, not bookkeeping: cargo-about only sees
# Rust crates and will never list them.
[[package.metadata.packager.resources]]
src = "../../fonts/LICENSE-DejaVu.txt"
target = "licenses/LICENSE-DejaVu.txt"

[[package.metadata.packager.resources]]
src = "../../fonts/LICENSE-NotoColorEmoji.txt"
target = "licenses/LICENSE-NotoColorEmoji.txt"

[[package.metadata.packager.resources]]
src = "../../THIRD-PARTY-LICENSES.html"
target = "licenses/THIRD-PARTY-LICENSES.html"

[package.metadata.packager.deb]
# Vulkan is dlopened, never linked, so libvulkan1 does not show up as an ELF
# dependency and has to be declared. at-spi2-core is what accesskit_unix talks
# to over D-Bus: without it the app runs but is silent to screen readers,
# which for this application is a complete failure.
#
# FreeType itself is linked statically (scripts/setup-freetype.sh builds it
# that way, so the binary does not depend on a /usr/local copy that will not
# exist on a user's machine), but the libpng and zlib it was built against
# stay dynamic and are needed for colour emoji to render.
#
# xvfb is what lets the web browser provider run Chrome headed on an invisible
# X11 display, which is the mode that websites see as a normal browser. No
# desktop distribution installs it by default, and without it the provider
# falls back to Chrome's headless mode, which some sites block
# (`linux_chrome_launch` in lib/lib_webbrowser/src/lib.rs).
depends = ["libvulkan1", "at-spi2-core", "libssl3", "libpng16-16", "zlib1g", "xvfb"]

# Use the real desktop entry instead of cargo-packager's template, which knows
# only Name/Comment/Exec/Icon/Categories and would ship `Name=sicompass` with
# an empty `Categories=` and no `StartupWMClass`.
#
# This is a Handlebars template as far as cargo-packager is concerned, but the
# file contains no `{{...}}`, so it is copied through verbatim.
#
# It reaches the AppImage too: `appimage::package` builds its AppDir by calling
# `deb::generate_data`, which is what reads this key. That is the only way to
# fix the AppImage's entry, since `AppImageConfig` has no template field of its
# own. Without it the AppImage gets the bare template above and desktop
# integration has nothing useful to install.
desktop-template = "../../assets/sicompass.desktop"

# Key is the SOURCE, value is the path inside the package. That is the
# opposite of what cargo-packager's own documentation says, but it is what
# `copy_custom_files` does: `for (src, target) in files.iter()`. Getting it
# backwards fails with an I/O error naming the absolute target path, which
# reads like a permissions problem and is not.
# The `.desktop` file is not here: `desktop-template` above already installs
# it, and doing it from both places would leave the AppImage on the stub
# (`appimage::package` reads `desktop-template`, but copies `appimage.files`
# rather than `deb.files`).
#
# Only the scalable icon needs copying by hand. cargo-packager's `icons` list
# handles the PNGs but skips anything that is not a `.png`.
[package.metadata.packager.deb.files]
"../../assets/icons/sicompass.svg" = "/usr/share/icons/hicolor/scalable/apps/sicompass.svg"

[package.metadata.packager.appimage]
# linuxdeploy bundles every shared library it can find, which is exactly wrong
# for a dlopened Vulkan loader: a bundled libvulkan.so.1 shadows the host's and
# then cannot see the host's ICD files, so the AppImage finds no GPU on a
# machine where the app otherwise works. The graphics and windowing stack has
# to come from the host.
excluded-libraries = [
    "libvulkan*",
    "libGL*",
    "libEGL*",
    "libgbm*",
    "libdrm*",
    "libwayland*",
    "libxkbcommon*",
]

# The AppImage has its own custom-file list, so the scalable icon has to be
# named twice. Same source, same destination, same key-is-the-source quirk as
# `deb.files` above.
[package.metadata.packager.appimage.files]
"../../assets/icons/sicompass.svg" = "/usr/share/icons/hicolor/scalable/apps/sicompass.svg"

[package.metadata.packager.macos]
# Must stay equal to MACOSX_DEPLOYMENT_TARGET in .cargo/config.toml, or the
# Info.plist advertises a floor the binary was not built for.
minimum-system-version = "11.0"
# macOS has no system Vulkan. Bundling MoltenVK is what makes the .dmg work
# with nothing else installed. `render::load_vulkan_entry` looks in
# Contents/Frameworks first for exactly this file.
#
# The path is rewritten per runner by native-packages.yml, because Homebrew's
# prefix differs between Apple Silicon (/opt/homebrew) and Intel (/usr/local).
frameworks = ["/opt/homebrew/lib/libMoltenVK.dylib"]
# Ad-hoc sign, and let cargo-packager do it rather than a step in the workflow.
#
# Bundling MoltenVK rewrites install names inside the .app, which invalidates
# the signature the linker produced, and Apple Silicon refuses to execute an
# unsigned binary. So the bundle has to be signed, and it has to be signed
# *before* the .dmg is built.
#
# That last part is why this cannot be a `codesign` step in native-packages.yml.
# The .dmg packager rebuilds the .app whenever one was not produced in the same
# cargo-packager invocation, so signing between two invocations is undone by the
# second, and signing after a combined `--formats app,dmg` run is too late
# because the .dmg has already been sealed. Every release up to 0.1.12 shipped
# an unsigned bundle for exactly that reason. cargo-packager signs the bundle
# root between its own app and dmg stages, which is the only point that works.
#
# "-" is ad-hoc: it makes the app launchable but does NOT satisfy Gatekeeper,
# so users still clear the quarantine flag until there is a Developer ID to
# notarize with. cargo-packager passes `--timestamp`, which codesign ignores
# for an ad-hoc signature rather than rejecting.
signing-identity = "-"
# Required *because* of the line above. cargo-packager signs every Mach-O with
# `--options runtime` and offers no way to switch that off, and the hardened
# runtime refuses to let an ad-hoc signed binary load an ad-hoc signed dylib
# ("different Team IDs"). That is libMoltenVK.dylib, so 0.1.14 shipped a macOS
# app that could not render at all. See the file itself for the full story.
#
# Unlike every other path in this file, this one is NOT resolved relative to the
# manifest: cargo-packager passes it to codesign verbatim, so it is interpreted
# against whatever directory codesign happens to run in. native-packages.yml
# rewrites it to an absolute path for that reason, the same way it rewrites the
# MoltenVK path above.
#
# Keep that plist free of XML comments. codesign parses entitlements with AMFI,
# which is stricter than plutil: a comment ahead of the DOCTYPE lints clean and
# then fails the build with "AMFIUnserializeXML: syntax error". 0.1.15 died that
# way, so the explanation lives here rather than in the file.
entitlements = "src/sicompass/macos-entitlements.plist"

# ---------------------------------------------------------------------------
# RPM (cargo-generate-rpm)
# ---------------------------------------------------------------------------
#
# cargo-packager has no RPM format (its PackageFormat is App, Dmg, Wix, Nsis,
# Deb, AppImage, Pacman), so the .rpm is built separately. cargo-generate-rpm
# is pure Rust and needs no rpmbuild, so it runs on the same ubuntu runner.
#
# Source paths here are relative to the invocation directory, and
# native-packages.yml runs it from the workspace root.
[package.metadata.generate-rpm]
summary = "Use your whole computer from the keyboard, with no mouse needed"
license = "GPL-3.0-only"
url = "https://github.com/friendlyflow/sicompass"
# Same reasoning as the .deb `depends` above. Xvfb is requested by file rather
# than by package name because the name is not portable: Fedora and RHEL ship
# it as xorg-x11-server-Xvfb, openSUSE as part of xorg-x11-server-extra. Every
# one of them provides /usr/bin/Xvfb, and rpm indexes bin directories, so the
# file dependency resolves on all three.
requires = { vulkan-loader = "*", at-spi2-core = "*", openssl-libs = "*", libpng = "*", zlib = "*", "/usr/bin/Xvfb" = "*" }

# The RPM equivalent of src/sicompass/deb/postinst, and required by the Fedora
# packaging guidelines for the same reason: installing the icons is not enough,
# something has to invalidate the desktop's icon cache or the menu entry shows
# up with no icon. Bumping the directory mtime comes first, because that is
# what makes GTK and KDE distrust a cache another package left behind.
#
# Kept inline rather than pointing at a file: cargo-generate-rpm reads the
# value as a path if one exists and as the script body otherwise, and a
# multi-line string can never be mistaken for a path.
#
# `|| :` on every line — a failing scriptlet makes rpm report the whole
# transaction as failed, and none of this is worth that.
post_install_script = """
touch --no-create /usr/share/icons/hicolor >/dev/null 2>&1 || :
gtk-update-icon-cache -q -t -f /usr/share/icons/hicolor >/dev/null 2>&1 || :
update-desktop-database -q /usr/share/applications >/dev/null 2>&1 || :
"""

post_uninstall_script = """
touch --no-create /usr/share/icons/hicolor >/dev/null 2>&1 || :
gtk-update-icon-cache -q -t -f /usr/share/icons/hicolor >/dev/null 2>&1 || :
update-desktop-database -q /usr/share/applications >/dev/null 2>&1 || :
"""

assets = [
    { source = "target/release/sicompass", dest = "/usr/bin/sicompass", mode = "755" },
    # No provider assets here: they are compiled into the binary, so the rpm ships
    # the executable, the desktop entry, the icons and the license texts only.
    { source = "assets/sicompass.desktop", dest = "/usr/share/applications/sicompass.desktop", mode = "644" },
    { source = "assets/icons/sicompass.svg", dest = "/usr/share/icons/hicolor/scalable/apps/sicompass.svg", mode = "644" },
    { source = "assets/icons/16x16.png", dest = "/usr/share/icons/hicolor/16x16/apps/sicompass.png", mode = "644" },
    { source = "assets/icons/22x22.png", dest = "/usr/share/icons/hicolor/22x22/apps/sicompass.png", mode = "644" },
    { source = "assets/icons/24x24.png", dest = "/usr/share/icons/hicolor/24x24/apps/sicompass.png", mode = "644" },
    { source = "assets/icons/32x32.png", dest = "/usr/share/icons/hicolor/32x32/apps/sicompass.png", mode = "644" },
    { source = "assets/icons/48x48.png", dest = "/usr/share/icons/hicolor/48x48/apps/sicompass.png", mode = "644" },
    { source = "assets/icons/64x64.png", dest = "/usr/share/icons/hicolor/64x64/apps/sicompass.png", mode = "644" },
    { source = "assets/icons/128x128.png", dest = "/usr/share/icons/hicolor/128x128/apps/sicompass.png", mode = "644" },
    { source = "assets/icons/256x256.png", dest = "/usr/share/icons/hicolor/256x256/apps/sicompass.png", mode = "644" },
    { source = "assets/icons/512x512.png", dest = "/usr/share/icons/hicolor/512x512/apps/sicompass.png", mode = "644" },
    { source = "LICENSE", dest = "/usr/share/doc/sicompass/LICENSE", mode = "644" },
    { source = "THIRD-PARTY-LICENSES.html", dest = "/usr/share/doc/sicompass/THIRD-PARTY-LICENSES.html", mode = "644" },
    { source = "fonts/LICENSE-DejaVu.txt", dest = "/usr/share/doc/sicompass/LICENSE-DejaVu.txt", mode = "644" },
    { source = "fonts/LICENSE-NotoColorEmoji.txt", dest = "/usr/share/doc/sicompass/LICENSE-NotoColorEmoji.txt", mode = "644" },
]

[features]
# What the WASM plugin host compiles guests *to*.
#
#   cargo build --no-default-features --features no-jit-wasm,bundled-sdl3
#
# is the App Store / iOS build: it emits no native code at runtime, so it needs no
# `allow-jit` entitlement. Runtime native codegen is forbidden outright on iOS.
#
# Both features keep Cranelift, and that is not an oversight. Pulley is an
# *interpreter for a bytecode that Cranelift lowers wasm into*, not a replacement
# for it — with `pulley` alone, `Component::new` does not even exist, because
# nothing can turn a `.wasm` into anything runnable. What `no-jit-wasm` changes is
# the Cranelift *target*: `pulley64` instead of the host ISA, so the output is
# interpreted bytecode rather than executable machine code. No W^X pages, no JIT.
#
# The cost is speed: an interpreted guest is far slower than a JIT-compiled one,
# which is why the WIT world batches per-frame reads into a single `poll()` call.
#
# Cargo features are additive, so a feature cannot *remove* Cranelift — hence the
# default-on/opt-out shape rather than an opt-in `no-jit` flag.
default = ["jit-wasm"]
jit-wasm = ["wasmtime/cranelift"]
no-jit-wasm = ["wasmtime/cranelift", "wasmtime/pulley"]

# Build SDL3 from its vendored source and link it statically, so the resulting
# binary is self-contained (no system SDL3 / SDL3.dll / libSDL3.dylib needed).
# Off by default — local dev builds keep linking the system SDL3. Release
# builds enable it (see `[workspace.metadata.dist] features` in the root
# Cargo.toml). Building from source needs `cmake` and a C compiler on PATH.
#
#
# `no-sdl-libc` is deliberately NOT part of this feature — it is enabled only on
# Windows, via the `[target.'cfg(target_os = "windows")'.dependencies]` block
# below. See the comment there for why enabling it everywhere broke the Linux
# build.
bundled-sdl3 = ["sdl3/build-from-source-static"]

[dependencies]
sicompass-sdk = { workspace = true }
async-trait = { workspace = true }
sicompass-builtins = { workspace = true }
sicompass-updater = { workspace = true }

serde = { workspace = true }
serde_json = { workspace = true }
reqwest = { workspace = true }
semver = { workspace = true }

ash = { workspace = true }
glam = { workspace = true }

freetype = { workspace = true }
rustybuzz = { workspace = true }

image = { workspace = true }
base64 = { workspace = true }

sdl3 = { workspace = true }
# Pulled in transitively by `sdl3`; declared here so the Windows-only
# `no-sdl-libc` knob below has something to attach to. Version constraint
# matches `sdl3`'s own pin so Cargo unifies to one copy.
sdl3-sys = "0.6.7"

accesskit = { workspace = true }

whatlang = { workspace = true }

unicode-normalization = { workspace = true }

nucleo-matcher = { workspace = true }

tokio = { workspace = true }

tracing = { workspace = true }
tracing-subscriber = { workspace = true }
tracing-appender = { workspace = true }

wasmtime = { workspace = true }

[target.'cfg(target_os = "linux")'.dependencies]
accesskit_unix = { workspace = true }

[target.'cfg(target_os = "windows")'.dependencies]
accesskit_windows = { workspace = true }
windows = { workspace = true }
# `no-sdl-libc` makes SDL3 use its own SDL_atof/SDL_sinf/etc. implementations
# instead of calling into the C runtime. It is needed on Windows MSVC: the
# bundled sdl3-sys + cmake stack doesn't propagate Rust's static-CRT choice to
# SDL3's CMake build, so SDL3 ends up compiled with /MD (dynamic CRT) while
# rustc links /MT (static CRT). The resulting `__imp_atof`-style unresolved
# externals break the release link. Cutting SDL's libc dependency sidesteps
# the mismatch and keeps the binary truly standalone (no vcruntime140.dll).
#
# It must stay Windows-only. sdl3-sys forwards it to CMake as `-DSDL_LIBC=OFF`,
# which un-defines `HAVE_STDIO_H`, which is the guard around the
# `#include <errno.h>` in SDL's `src/io/SDL_iostream.c`. That file then uses
# `errno`/`EINTR` undeclared and GCC rejects it. That, not SDL 3.4.12 itself,
# is why `bundled-sdl3` used to fail on Linux and why ci.yml built SDL 3.2.28
# from source instead. Do not move this back into the feature.
sdl3-sys = { version = "0.6.7", features = ["no-sdl-libc"] }

[target.'cfg(target_os = "macos")'.dependencies]
accesskit_macos = { workspace = true }

[target.'cfg(target_os = "windows")'.build-dependencies]
winresource = { workspace = true }

[dev-dependencies]
sicompass-builtins = { workspace = true }
sicompass-settings = { workspace = true }
sicompass-filebrowser = { workspace = true }
sicompass-tutorial = { workspace = true }
sicompass-webbrowser = { workspace = true }
# Only to switch its recall history off for the test binary — see
# `ensure_builtins`. Without it, every run appends the commands these tests run
# to the developer's own shell history.
sicompass-terminal = { workspace = true }
# Only to switch personal-skill discovery off for the test binary — see
# `ensure_builtins`. Without it the skills-palette tests would see whatever
# lives in the developer's own `~/.claude/skills`.
sicompass-claude = { workspace = true }
# Only to switch network access off for the test binary — see
# `ensure_builtins`. Without it a fixture repository with a remote configured
# would have these tests contacting it.
sicompass-gitclient = { workspace = true }
sicompass-chatclient = { workspace = true }
sicompass-emailclient = { workspace = true }
sicompass-remote = { workspace = true }
mockall = { workspace = true }
tempfile = { workspace = true }
# The integration test injects its own `ImapBackend` stubs, which the trait
# requires to be `#[async_trait]`.
async-trait = { workspace = true }
wit-parser = "0.258.0"
wit-component = "0.258.0"
wiremock.workspace = true
