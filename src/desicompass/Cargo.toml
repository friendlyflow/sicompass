[package]
publish = false  # internal crate, never published to crates.io
name = "desicompass"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "desicompass — Wayland compositor (Rust/smithay port of src/desicompass-c/)"

[[bin]]
name = "desicompass"
path = "src/main.rs"

# cargo-dist discovers every `[[bin]]` in the workspace, and
# `dist-workspace.toml` targets Windows and both macOS triples. This is a
# Linux-only compositor, so a release run must not try to build or ship a
# `desicompass.exe`.
[package.metadata.dist]
dist = false

[features]
# The TTY/DRM backend, off by default on purpose. Enabling it pulls in
# libinput, libseat, libudev and gbm, which the Ubuntu CI runner does not
# install and `nix develop` only provides on Linux. CI runs
# `cargo clippy --workspace --all-targets` on macOS and Windows too, so a
# default-on `tty` would fail those legs the moment it exists. Build the
# session binary with `cargo build -p desicompass --features tty`.
tty = [
    "smithay/backend_gbm",
    "smithay/backend_libinput",
    "smithay/backend_udev",
    "smithay/backend_session_libseat",
    "smithay/renderer_multi",
]

[target.'cfg(target_os = "linux")'.dependencies]
# Smithay: Wayland compositor framework.
# backend_winit  — run inside an existing X11/Wayland session (development).
# backend_egl    — EGL context used by the winit + gles backend.
# renderer_gl    — GlesRenderer for rendering to the winit window.
# use_system_lib — link against system wayland/xkb C libraries.
# desktop        — Space + Window layout helpers.
# wayland_frontend — server-side Wayland protocol implementations.
# backend_drm    — not for the TTY backend (that is the `tty` feature below),
#                  but for `DrmNode`. Advertising zwp_linux_dmabuf_v1 means
#                  telling clients which device to allocate on, and the
#                  device id comes from `EGLDevice::try_get_render_node`,
#                  which is gated on this feature. It pulls the `drm` and
#                  `drm-ffi` crates only — no system library, and the CI
#                  runner already installs libdrm-dev.
#
# Pinned to a git commit rather than a crates.io release: 0.7.0 (June 2025)
# is the last release, and master is far ahead of it (Dispatch2 delegates,
# the DnD rework, InputTime). master still calls itself 0.7.0, so the rev is
# the only thing that identifies it. The Nix build (crane) fetches it by the
# rev in Cargo.lock, so bumping it needs no hash in flake.nix.
smithay = { git = "https://github.com/Smithay/smithay", rev = "79bbed5e1199090d787115614847a79c76607181", default-features = false, features = [
    "desktop",
    "wayland_frontend",
    "backend_winit",
    "backend_egl",
    "renderer_gl",
    "use_system_lib",
    "backend_drm",
] }

# Logging
tracing          = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Command-line argument parsing
clap = { version = "4", features = ["derive"] }

# Reads the keyboard layout from systemd-localed (org.freedesktop.locale1)
# on the system bus, which is where the OS installer puts it. Already in the
# lock through accesskit_unix, so this adds no crates.
zbus = { version = "5", default-features = false, features = ["blocking-api", "async-io"] }
