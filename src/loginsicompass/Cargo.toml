[package]
publish = false  # internal crate, never published to crates.io
name = "loginsicompass"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "loginsicompass — greetd login screen (Rust port of src/loginsicompass-c/)"

[[bin]]
name = "loginsicompass"
path = "src/main.rs"

# See the same block in src/desicompass/Cargo.toml: cargo-dist ships every
# workspace `[[bin]]`, and a greetd greeter is Linux-only.
[package.metadata.dist]
dist = false

[target.'cfg(target_os = "linux")'.dependencies]
# Wayland client — smithay-client-toolkit 0.21 for XDG shell, shm, seat
smithay-client-toolkit = { version = "0.21", default-features = false, features = [
    "xkbcommon",
] }
wayland-client = "0.31"

# Keyboard
xkeysym = "0.2"

# 2D drawing for framebuffer (no GPU needed)
tiny-skia = "0.11"

# PNG / JPEG background image loading (already in workspace)
image = { workspace = true }

# greetd IPC: JSON over Unix socket
serde = { workspace = true }
serde_json = { workspace = true }

# CLI
clap = { version = "4", features = ["derive"] }

# The renderer, and the element model it draws. This is the whole reason the
# greeter looks and speaks like the app: `<radio>`, `<password>`, the insert
# mode and the AccessKit tree are the app's, not a second implementation.
#
# Note what is NOT here: `sicompass`, the application crate. Linking it would
# drag wasmtime, a bundled SQLite, a headless-Chromium driver, an IMAP client
# and an SMTP client into a login screen. See sicompass-ui's Cargo.toml.
sicompass-sdk = { workspace = true }
sicompass-ui = { workspace = true }

# Wiping the password buffer once it has been handed to greetd. See the
# module docs in src/provider.rs for what this does and does not buy.
zeroize = { workspace = true }

# `localtime_r`, for the clock's UTC offset.
libc = { workspace = true }

# Logging
tracing          = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[dev-dependencies]
tempfile = { workspace = true }
# Driving the real renderer headlessly in tests/greeter_ui.rs. `sdl3` comes in
# through sicompass-ui already; this is only for the `Keycode`/`Mod` types the
# key dispatcher takes.
sdl3 = { workspace = true }
