[workspace]
members = [
    "lib/lib_tutorial",
    "lib/lib_settings",
    "lib/lib_payments",
    "lib/lib_filebrowser",
    "lib/lib_webbrowser",
    "lib/lib_chatclient",
    "lib/lib_emailclient",
    "lib/lib_texteditor",
    "lib/lib_remote",
    "lib/lib_sales_demo",
    "lib/lib_shell",
    "lib/lib_terminal",
    "lib/lib_claude",
    "lib/lib_gitclient",
    "lib/lib_notes",
    "lib/lib_project_management",
    "lib/lib_builtins",
    "lib/lib_updater",
    "src/sicompass",
    # The compositor (desicompass), the greetd greeter (loginsicompass) and the
    # renderer they share with the app (sicompass-ui) are sibling repos, see
    # .claude/repos.json.
]
resolver = "2"

[workspace.package]
version = "0.1.21"
edition = "2024"
license = "GPL-3.0-only"

[workspace.dependencies]
# SDK — published to crates.io from the sicompass-plugin-sdk repo. Third-party
# plugin authors consume the same version. Local development uses the path
# override in [patch.crates-io] below so edits in ../sicompass-plugin-sdk are
# picked up without a publish round-trip.
#
# 0.7.0 is a hard floor, not a preference: it is the release that added
# `platform::app_dir_name` and the `app_config_dir` / `app_data_dir` /
# `app_state_dir` / `app_cache_dir` helpers, which are what keep a debug build's
# config, state, data and cache out of an installed release build's. Every
# provider that persists anything calls one of them unconditionally
# (lib_notes, lib_terminal, lib_webbrowser, lib_emailclient,
# lib_project_management) as does the app's own clipboard cache, and there is no
# fallback path: on 0.6.0 they do not compile. (Carries forward
# `take_announcement` and `dashboard_uses_app_undo` from 0.6.0, both used
# unconditionally by lib_project_management's kanban dashboard, with the app's
# own announcement drain calling the first on every provider. Also the
# `supports_structural_edit` capability and `platform::data_home` from 0.5.0 —
# used unconditionally by lib_notes, lib_filebrowser, lib_sales_demo and
# lib_project_management — and the provider-scoped asset registry and
# `read-asset` host import from 0.4.0, likewise required unconditionally.)
sicompass-sdk = "0.8.0"
sicompass-tutorial = { path = "lib/lib_tutorial" }
sicompass-settings = { path = "lib/lib_settings" }
sicompass-payments = { path = "lib/lib_payments" }
sicompass-filebrowser = { path = "lib/lib_filebrowser" }
sicompass-webbrowser = { path = "lib/lib_webbrowser" }
sicompass-chatclient = { path = "lib/lib_chatclient" }
sicompass-emailclient = { path = "lib/lib_emailclient" }
sicompass-text-editor = { path = "lib/lib_texteditor" }
sicompass-remote = { path = "lib/lib_remote" }
sicompass-sales-demo = { path = "lib/lib_sales_demo" }
sicompass-shell = { path = "lib/lib_shell" }
sicompass-terminal = { path = "lib/lib_terminal" }
sicompass-claude = { path = "lib/lib_claude" }
sicompass-gitclient = { path = "lib/lib_gitclient" }
sicompass-notes = { path = "lib/lib_notes" }
sicompass-project-management = { path = "lib/lib_project_management" }
sicompass-builtins = { path = "lib/lib_builtins" }
sicompass-updater = { path = "lib/lib_updater" }
# The renderer shared with the login greeter, in its own repo
# (github:friendlyflow/sicompass-ui). Not on crates.io: pinned by git, to a `rev`
# between releases and to `tag = "vX.Y.Z"` at a release. crane vendors it from
# Cargo.lock like any git dependency, so there is no hash to maintain.
sicompass-ui = { git = "https://github.com/friendlyflow/sicompass-ui", rev = "8d58f6b27335472fa1eab65066a5a8c1002cacac" }

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Cryptography (offline license-certificate verification in lib_settings;
# also used by sicompass-updater for plugin signature verification)
ed25519-dalek = "3"
base64 = "0.23"
sha2 = "0.11"

# Versioning (used by sicompass-updater for app + plugin version comparison)
semver = "1"

# Graphics
ash = "0.38"
glam = "0.33"

# Text rendering
# Pinned to 0.7 (freetype-sys 0.20.1): it bundles + builds FreeType from source
# by default, which is what the Windows release runner needs (no pkg-config, no
# system freetype). 0.8 pulls freetype-sys 0.23, whose default build needs
# pkg-config and whose `bundled` feature has a broken libpng/zlib include path
# on MSVC. Revisit when freetype-sys fixes the bundled build.
#
# `rustybuzz` used to sit beside this and was removed in the sicompass-ui
# split: text is laid out per-codepoint through FreeType (see `text.rs`), and
# nothing in the workspace had ever called it.
freetype = "0.7"

# Image loading
image = { version = "0.25", features = ["jpeg", "png", "webp"] }

# Windowing + events
sdl3 = "0.18"

# Accessibility
accesskit = "0.25"
accesskit_unix = "0.23"
accesskit_windows = "0.35"
accesskit_macos = "0.27"
# `Win32_System_Com` + `Win32_UI_Shell` are for `start_menu.rs`, which builds
# the Start Menu `.lnk` through IShellLink. Every installer except the MSI
# leaves the app with no Start Menu entry, so the app makes its own.
windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_System_Com",
    "Win32_UI_Shell",
] }

# Language detection — tags each spoken AccessKit node with a BCP-47 language
# so the screen reader speaks each item in its own language.
whatlang = "0.18"

# Unicode
unicode-normalization = "0.1"

# Wiping a typed password out of the buffers that held it, rather than only
# setting their length to zero.
zeroize = "1"

# Fuzzy search
nucleo-matcher = "0.3"

# Natural sort
natord = "1"

# Async / networking (library providers, later phases)
tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.13", features = ["json", "blocking", "cookies", "form"] }

# Email client
#
# `async-imap` (async-email / Delta Chat) replaced the `imap` 2.x crate, which
# has had no stable release since 2023 and is advertising for maintainers. It
# re-exports its own `imap-proto`, so there is no separate pin to keep in sync.
# The default features select async-std, so they are off deliberately.
async-imap = { version = "0.11", default-features = false, features = ["runtime-tokio"] }
# Wraps the same `native-tls` that lettre uses, keeping one TLS implementation
# in the tree rather than adding rustls alongside it.
async-native-tls = { version = "0.6", default-features = false, features = ["runtime-tokio"] }
lettre = { version = "0.11", default-features = false, features = ["smtp-transport", "tokio1-native-tls", "builder"] }
async-trait = "0.1"
futures = "0.3"
# CancellationToken, for interrupting an IDLE wait immediately.
tokio-util = "0.7"
rusqlite = { version = "0.40", features = ["bundled"] }

# Plugin validation. `wasmparser` checks a staged plugin is a well-formed
# component without compiling it, which is all the updater needs to know.
wasmparser = "0.258"

# WASM plugin host. No compiler backend is selected here: the `sicompass` crate's
# `jit-wasm` (default) and `no-jit-wasm` features pick `cranelift` or `pulley`, so
# an App Store / iOS build can be built with no runtime code generation at all.
wasmtime = { version = "48", default-features = false, features = [
    "runtime",
    "component-model",
    "std",
    # On-disk compilation cache. Compiling a component is the dominant plugin
    # startup cost (~1.2s for a 65 KiB plugin), and without this every launch pays
    # it again. The cached artifact matches the backend: native code for the JIT
    # build, Pulley bytecode for the no-JIT one.
    "cache",
] }
# WASI p2 for plugin guests (they target wasm32-wasip2). Only what a sandboxed
# provider may get: the host links an inert baseline for every plugin and the
# rest per manifest grant, see docs/plugin-platform.md. `p2` only, synchronous:
# guest calls are synchronous today, and `p1` would only matter for guests
# built for the old preview-1 target, which none are.
wasmtime-wasi = { version = "48", default-features = false, features = ["p2"] }

# PTY (interactive shell sessions used by sicompass-shell)
portable-pty = "0.9"

# ANSI/VT parser (interactive terminal emulator inside sicompass-terminal)
vte = "0.15"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tracing-appender = "0.2"

# System
libc = "0.2"

# Windows .exe icon and version-resource embedding (build-time only).
# `winresource` is the maintained fork of the abandoned `winres`. It is a
# build-dependency, which `about.toml` ignores, so it does not appear in
# THIRD-PARTY-LICENSES.html.
winresource = "0.1"

# Test dependencies
mockall = "0.15"
tempfile = "3"
wiremock = "0.6"

# Local override so SDK edits in the sibling repo are picked up immediately.
#
# MUST STAY COMMENTED ON MAIN. The cargo-dist release build checks out only this
# repo, so a path pointing at a sibling that is not there fails at manifest-parse
# time — before anything is compiled, with an error that does not mention this
# block. Uncomment it while iterating on the SDK, and re-comment it before
# committing.
#
# The release flow for an SDK change is: publish the SDK first, then bump the pin
# above. Uncommenting is a local convenience, never how a release resolves the
# dependency.
#
# [patch.crates-io]
# sicompass-sdk = { path = "../sicompass-plugin-sdk" }
#
# Until the 0.2.0 release train publishes sicompass-sdk 0.9.0, the SDK is taken
# from its git repo at a fixed commit. This one is a *git* patch, which builds
# anywhere (CI, nix, a fresh checkout), unlike the path patch above that must
# stay commented. It applies to the whole graph, sicompass-ui included, so there
# is one SDK and one `Provider` trait. The SDK keeps a 0.8.x version while
# unreleased, so it still satisfies the `0.8.0` requirements. Remove this block
# when the pins move to the published 0.9.0.
[patch.crates-io]
sicompass-sdk = { git = "https://github.com/friendlyflow/sicompass-plugin-sdk", rev = "f540e771b32aad0df75af38908bf1be2823e04e2" }
#
# The same rule, for working on the renderer and the app together:
#
# [patch."https://github.com/friendlyflow/sicompass-ui"]
# sicompass-ui = { path = "../sicompass-ui" }

# Optimize heavy third-party deps even in debug builds — html5ever and the
# TLS/HTTP stack are 10-50x slower without optimizations.
[profile.dev.package.chromiumoxide]
opt-level = 2
[profile.dev.package.reqwest]
opt-level = 2

# The profile that 'dist' will build with
[profile.dist]
inherits = "release"
lto = "thin"
